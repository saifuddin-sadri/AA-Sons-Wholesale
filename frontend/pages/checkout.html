<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Checkout | A.A & Sons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=1.0.3" />
</head>

<body>

  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <img src="/logo.png" alt="A.A & Sons" class="logo-img"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="logo-fallback" style="display:none">
          <span class="logo-text">A.A <span class="amp">&</span> Sons</span>
        </div>
      </a>
      <div class="nav-right">
        <!-- Secure checkout badge -->
        <div style="display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--teal)">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0110 0v4" />
          </svg>
          Secure Checkout
        </div>
      </div>
    </div>
  </nav>

  <section class="page-hero" style="padding:24px 0">
    <div class="container">
      <!-- Steps -->
      <div class="checkout-steps">
        <div class="step completed">
          <span class="step-icon">✓</span>
          Cart
        </div>
        <div class="step-divider"></div>
        <div class="step active">
          <span class="step-icon">2</span>
          Checkout
        </div>
        <div class="step-divider"></div>
        <div class="step upcoming">
          <span class="step-icon">3</span>
          Confirmation
        </div>
      </div>
    </div>
  </section>

  <section class="checkout-page">
    <div class="container">
      <div class="checkout-layout">

        <!-- ── FORM ── -->
        <div class="checkout-form-section">
          <h2>Delivery Details</h2>
          <div class="form-grid" id="checkoutForm">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-input" id="shName" placeholder="Your full name" required />
            </div>
            <div class="form-group">
              <label class="form-label">Phone *</label>
              <input type="tel" class="form-input" id="shPhone" placeholder="+919876543210" required />
            </div>
            <div class="form-group full">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" id="shEmail" placeholder="your@email.com" />
            </div>
            <div class="form-group full">
              <label class="form-label">Street Address *</label>
              <input type="text" class="form-input" id="shStreet" placeholder="House No., Street, Locality" required />
            </div>
            <div class="form-group">
              <label class="form-label">City *</label>
              <input type="text" class="form-input" id="shCity" placeholder="City" required />
            </div>
            <div class="form-group">
              <label class="form-label">State *</label>
              <input type="text" class="form-input" id="shState" list="statesList" placeholder="State" required />
              <datalist id="statesList"></datalist>
            </div>
            <div class="form-group">
              <label class="form-label">PIN Code *</label>
              <input type="text" class="form-input" id="shPincode" placeholder="123456" maxlength="6" required />
            </div>
            <div class="form-group full">
              <label class="form-label">Order Notes (optional)</label>
              <textarea class="form-textarea" id="orderNotes" placeholder="Any special instructions…"></textarea>
            </div>
          </div>

          <div style="margin-top:24px; padding:16px; background:rgba(27, 94, 75, 0.05); border:1.5px dashed var(--teal); border-radius:12px;">
            <label style="display:flex; align-items:center; gap:12px; cursor:pointer; margin:0;">
              <input type="checkbox" id="storePickupToggle" style="width:20px; height:20px; accent-color:var(--teal);" />
              <div style="flex:1">
                <div style="font-weight:700; color:var(--teal); font-size:.95rem;">Collect from Store</div>
                <div style="font-size:.78rem; color:var(--mid);">Skip shipping charges and pick up your items directly from our store.</div>
              </div>
            </label>
          </div>

          <h2 style="margin-top:28px">Payment Method</h2>
          <div class="payment-methods">
            <label class="payment-option selected" id="pmOnline" style="cursor: default;">
              <input type="radio" name="payment" value="upi" checked style="display:none" />
              <span class="pm-icon">📱</span>
              <div>
                <div class="pm-label">Pay via UPI</div>
                <div class="pm-sub">GPay, PhonePe, Paytm, etc.</div>
              </div>
            </label>
          </div>

          <button class="btn-place-order" id="placeOrderBtn">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
            <span id="placeOrderText">Place Order</span>
          </button>

          <p style="text-align:center;font-size:.72rem;color:var(--mid);margin-top:12px">
            🔒 Your information is encrypted and secure
          </p>
        </div>

        <!-- ── ORDER SUMMARY ── -->
        <div class="checkout-summary">
          <div class="summary-header">Your Order</div>
          <div id="checkoutOrderItems"></div>
          <div class="summary-body">
            <div class="summary-line">
              <span>Subtotal</span>
              <span id="coSubtotal">₹0</span>
            </div>
            <div class="summary-line" style="color:var(--teal)">
              <span>Total Weight</span>
              <span id="coWeight">0 kg</span>
            </div>
            <div class="summary-line" id="coShippingLine">
              <span>Shipping</span>
              <span id="coShipping">₹150</span>
            </div>
            <hr class="summary-divider" />
            <div class="summary-total">
              <span>Total</span>
              <span class="amount" id="coTotal">₹0</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <script src="/js/api.js?v=1.0.3"></script>
  <script src="/js/cart.js?v=1.0.3"></script>
  <script src="/js/checkout.js?v=1.0.3"></script>
</body>

</html>
