<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Checkout | A.A & Sons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=1.0.3" />
</head>

<body>

  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <img src="/logo.png" alt="A.A & Sons" class="logo-img"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="logo-fallback" style="display:none">
          <span class="logo-text">A.A <span class="amp">&</span> Sons</span>
        </div>
      </a>
      <div class="nav-right">
        <div style="display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--teal)">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0110 0v4" />
          </svg>
          Secure Checkout
        </div>
      </div>
    </div>
  </nav>

  <section class="page-hero" style="padding:24px 0">
    <div class="container">
      <div class="checkout-steps">
        <div class="step completed">
          <span class="step-icon">✓</span>
          Cart
        </div>
        <div class="step-divider"></div>
        <div class="step active">
          <span class="step-icon">2</span>
          Checkout
        </div>
        <div class="step-divider"></div>
        <div class="step upcoming">
          <span class="step-icon">3</span>
          Confirmation
        </div>
      </div>
    </div>
  </section>

  <section class="checkout-page">
    <div class="container">
      <div class="checkout-layout">

        <!-- ── DETAILS CARD ── -->
        <div class="checkout-form-section">
          <div class="checkout-details-card" style="background:#ffffff; padding:32px; border-radius:16px; border:1px solid rgba(200,135,58,0.15); box-shadow:0 15px 40px rgba(0,0,0,0.04);">
            <h2 style="margin-bottom:24px; font-family:'Cormorant Garamond', serif; color:var(--teal); font-size:2rem; border-bottom: 2px solid rgba(27,94,75,0.1); padding-bottom:10px;">Delivery Information</h2>
            
            <div id="checkoutUserDetails" style="display:flex; flex-direction:column; gap:16px; font-size:0.95rem; line-height:1.6; color:var(--dark);">
              <p style="color:var(--mid);">Loading your verified account details...</p>
            </div>
            
            <div class="form-group full" style="margin-top:24px; border-top: 1px solid var(--light-gray); padding-top:20px;">
              <label class="form-label" style="font-weight:600; color:var(--teal); font-size:0.85rem; text-transform:uppercase;">Order Notes (optional)</label>
              <textarea class="form-textarea" id="orderNotes" placeholder="Provide any special instructions, landmark, or requirements here..." style="width:100%; height:90px; padding:12px; border-radius:8px; border:1.5px solid var(--light-gray); outline:none; font-family:var(--font-body); font-size:0.88rem; transition:border-color 0.2s;" onfocus="this.style.borderColor='var(--teal)'" onblur="this.style.borderColor='var(--light-gray)'"></textarea>
            </div>
          </div>

          <button class="btn-place-order" id="placeOrderBtn" style="margin-top:28px; width:100%; display:flex; justify-content:center; align-items:center; gap:10px; height:54px; font-size:1.05rem;">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
            <span id="placeOrderText">Confirm & Place Order</span>
          </button>

          <p style="text-align:center;font-size:.72rem;color:var(--mid);margin-top:12px">
            🔒 Verification is complete. No payment required at this stage.
          </p>
        </div>

        <!-- ── ORDER SUMMARY ── -->
        <div class="checkout-summary">
          <div class="summary-header">Your Order</div>
          <div id="checkoutOrderItems"></div>
          <div class="summary-body">
            <div class="summary-line">
              <span>Subtotal</span>
              <span id="coSubtotal">₹0</span>
            </div>
            <div class="summary-line" style="color:var(--teal)">
              <span>Total Weight</span>
              <span id="coWeight">0 kg</span>
            </div>
            <div class="summary-line" id="coShippingLine">
              <span>Shipping</span>
              <span id="coShipping">₹0</span>
            </div>
            <hr class="summary-divider" />
            <div class="summary-total">
              <span>Total</span>
              <span class="amount" id="coTotal">₹0</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <script src="/js/api.js?v=1.0.3"></script>
  <script src="/js/cart.js?v=1.0.3"></script>
  <script src="/js/checkout.js?v=1.0.3"></script>
</body>

</html>
