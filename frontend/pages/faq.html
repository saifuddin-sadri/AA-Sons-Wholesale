  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What products does A.A & Sons offer?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A.A & Sons offers a wide range of premium marriage goods and devotional wear. You can browse our <a href='/products'>online shop</a> for Bhagwan Poshak (deity clothing), sherwanis, sarees, lehengas, potlis, packing items, gifting items, toran decorations, and poshak shringar."
        }
      },
      {
        "@type": "Question",
        "name": "Do you offer home delivery?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes! A.A & Sons provides safe and reliable home delivery across India for all our wedding and devotional products. You can shop our <a href='/products'>marriage goods collection</a> online and have it delivered to your doorstep."
        }
      },
      {
        "@type": "Question",
        "name": "Where is A.A & Sons located in Indore?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Our store is located at Shop no. 06, Marothiya Bazar, near Bajaj Khana Chowk, Indore, Madhya Pradesh. We are known as the best <a href='/'>marriage goods shop in Indore</a> since 1950."
        }
      },
      {
        "@type": "Question",
        "name": "What are your store timings?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We are open Monday to Saturday from 9:00 AM to 8:00 PM, and on Sundays from 10:00 AM to 5:00 PM. If you can't visit us in person, you can always <a href='/products'>buy marriage goods online</a> on our website."
        }
      },
      {
        "@type": "Question",
        "name": "Do you accept bulk or wholesale orders?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Absolutely! A.A & Sons accepts bulk and wholesale orders (100+ pieces) for all product categories, including marriage goods, Bhagwan Poshak, and gifting items. Please use our Bulk Enquiry form on any product page or contact us directly on WhatsApp at +91 88274 78757."
        }
      },
      {
        "@type": "Question",
        "name": "How can I contact A.A & Sons?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "You can reach us at: Phone: +91 88274 78757, WhatsApp: +91 88274 78757, Email: abbasaliaandsons786@gmail.com, or visit our store at Shop no. 06, Marothiya Bazar, Indore."
        }
      },
      {
        "@type": "Question",
        "name": "How long has A.A & Sons been in business?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A.A & Sons has been serving families in Indore and across India since 1950 — over 75 years of trust and heritage in marriage goods and devotional wear."
        }
      },
      {
        "@type": "Question",
        "name": "What payment methods do you accept?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We accept online payments via UPI (GPay, PhonePe, Paytm, etc.), credit cards, debit cards, and cash on store pickup. All online transactions are encrypted and secure."
        }
      },
      {
        "@type": "Question",
        "name": "What is Bhagwan Poshak and do you have a good collection?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Bhagwan Poshak (also known as Poshak Shringar) refers to the sacred clothing and adornments for deities in Hindu temples and home shrines. A.A & Sons has one of Indore's largest collections of Bhagwan Poshak, crafted from fine fabrics with intricate embroidery and detailing."
        }
      },
      {
        "@type": "Question",
        "name": "Can I return or exchange a product?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We take great care to ensure every product meets our quality standards before dispatch. For any issues or concerns with your order, please contact us within 48 hours of delivery at +91 88274 78757 or abbasaliaandsons786@gmail.com."
        }
      }
    ]
  }

    .form-input:focus { border-color: var(--gold); outline: none; }
    textarea.form-input { resize: vertical; min-height: 120px; }

    .btn-submit:hover { background: var(--teal); }
